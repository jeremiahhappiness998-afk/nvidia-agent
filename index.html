<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>NVIDIA Mobile Agent</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #1a1a1a; --surface-hover: #2a2a2a;
            --text: #e0e0e0; --text-secondary: #888; --accent: #76b900; /* NVIDIA Green */
            --user-bubble: #005a9e; --agent-bubble: #1e1e1e; --border: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header h1 span { color: var(--accent); }
        .header button {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
        }
        /* Chat Area */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%; padding: 10px 14px; border-radius: 16px;
            font-size: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px;
        }
        .message.agent {
            align-self: flex-start; background: var(--agent-bubble); border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center; background: transparent; color: var(--text-secondary);
            font-size: 12px; text-align: center; max-width: 100%;
        }
        /* Input Area */
        .input-area {
            display: flex; gap: 8px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--surface); border-top: 1px solid var(--border);
        }
        .input-area textarea {
            flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 10px 14px; border-radius: 24px; font-size: 16px; resize: none;
            outline: none; max-height: 120px; font-family: inherit;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .input-area button {
            background: var(--accent); border: none; color: #000; width: 44px; height: 44px;
            border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .input-area button:disabled { opacity: 0.5; }
        /* Settings Panel */
        .settings-panel {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px); z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .settings-panel.open { display: flex; }
        .settings-content {
            background: var(--surface); padding: 24px; border-radius: 16px; width: 100%;
            max-width: 400px; border: 1px solid var(--border);
        }
        .settings-content h2 { margin-bottom: 16px; font-size: 18px; }
        .settings-content label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
        .settings-content input, .settings-content select {
            width: 100%; padding: 10px; margin-bottom: 16px; background: var(--bg);
            border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px;
        }
        .settings-content .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
        .settings-content .btn-row button {
            padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer;
        }
        .btn-save { background: var(--accent); color: #000; font-weight: 600; }
        .btn-close { background: var(--surface-hover); color: var(--text); }
        .disclaimer { font-size: 11px; color: var(--text-secondary); margin-top: 8px; line-height: 1.4; }
        /* Typing Indicator */
        .typing { display: flex; gap: 4px; padding: 12px 16px; align-self: flex-start; }
        .typing span {
            width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>⚡ NVIDIA <span>Agent</span></h1>
        <button id="settingsBtn">⚙️ Settings</button>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="message system">Connect your NVIDIA API key in Settings to begin.</div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <textarea id="userInput" rows="1" placeholder="Ask the agent anything..."></textarea>
        <button id="sendBtn" disabled>↑</button>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <h2>⚙️ Configuration</h2>
            <label for="apiKeyInput">NVIDIA API Key</label>
            <input type="password" id="apiKeyInput" placeholder="nvapi-...">
            <label for="modelSelect">Model</label>
            <select id="modelSelect">
                <option value="meta/llama-3.3-70b-instruct">Llama 3.3 70B (Recommended)</option>
                <option value="nvidia/llama-3.1-nemotron-70b-instruct">Nemotron 70B</option>
                <option value="deepseek-ai/deepseek-v3.2">DeepSeek V3.2</option>
                <option value="mistralai/mistral-large-2-instruct">Mistral Large 2</option>
            </select>
            <div class="btn-row">
                <button class="btn-close" id="closeSettings">Cancel</button>
                <button class="btn-save" id="saveSettings">Save</button>
            </div>
            <p class="disclaimer">Your key is stored locally on this device only. Never share it publicly. Get a free key at build.nvidia.com.</p>
        </div>
    </div>

    <script>
        (function() {
            // --- State ---
            let apiKey = localStorage.getItem('nvidia_api_key') || '';
            let model = localStorage.getItem('nvidia_model') || 'meta/llama-3.3-70b-instruct';
            let messages = []; // Conversation history
            let isLoading = false;

            // --- DOM Elements ---
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const closeSettings = document.getElementById('closeSettings');
            const saveSettings = document.getElementById('saveSettings');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const modelSelect = document.getElementById('modelSelect');

            // --- Initialization ---
            function init() {
                // Load saved key into input field (masked)
                if (apiKey) {
                    apiKeyInput.value = apiKey;
                    modelSelect.value = model;
                    sendBtn.disabled = false;
                    addSystemMessage('🔑 API key loaded. You can start chatting.');
                }
                // Auto-resize textarea
                userInput.addEventListener('input', () => {
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                });
            }

            // --- Settings Panel ---
            settingsBtn.addEventListener('click', () => {
                apiKeyInput.value = apiKey;
                modelSelect.value = model;
                settingsPanel.classList.add('open');
            });

            closeSettings.addEventListener('click', () => {
                settingsPanel.classList.remove('open');
            });

            saveSettings.addEventListener('click', () => {
                const newKey = apiKeyInput.value.trim();
                const newModel = modelSelect.value;
                if (!newKey) {
                    alert('Please enter an API key.');
                    return;
                }
                apiKey = newKey;
                model = newModel;
                localStorage.setItem('nvidia_api_key', apiKey);
                localStorage.setItem('nvidia_model', model);
                settingsPanel.classList.remove('open');
                sendBtn.disabled = false;
                addSystemMessage('✅ Settings saved. You can now chat.');
            });

            // --- Chat Logic ---
            function addMessage(role, content) {
                const div = document.createElement('div');
                div.className = `message ${role}`;
                div.textContent = content;
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                // Store in history
                messages.push({ role, content });
                return div;
            }

            function addSystemMessage(text) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.textContent = text;
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function showTyping() {
                const div = document.createElement('div');
                div.className = 'typing';
                div.id = 'typingIndicator';
                div.innerHTML = '<span></span><span></span><span></span>';
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function hideTyping() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }

            async function sendMessage() {
                const text = userInput.value.trim();
                if (!text || isLoading) return;

                if (!apiKey) {
                    addSystemMessage('⚠️ Please set your NVIDIA API key first.');
                    return;
                }

                // Add user message
                addMessage('user', text);
                userInput.value = '';
                userInput.style.height = 'auto';
                isLoading = true;
                sendBtn.disabled = true;

                // Show typing indicator
                showTyping();

                try {
                    // Build conversation for API (OpenAI-compatible format)
                    const apiMessages = [
                        { role: 'system', content: 'You are a helpful, concise AI assistant running on a mobile device. Answer clearly and directly.' },
                        ...messages
                    ];

                    const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: apiMessages,
                            temperature: 0.7,
                            max_tokens: 1024,
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    const reply = data.choices?.[0]?.message?.content;

                    if (!reply) throw new Error('No response content received.');

                    hideTyping();
                    addMessage('agent', reply);

                } catch (error) {
                    hideTyping();
                    addSystemMessage(`❌ Error: ${error.message}`);
                } finally {
                    isLoading = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }

            // --- Event Listeners ---
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // --- Start ---
            init();
        })();
    </script>
</body>
</html>
