<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>NVIDIA Mobile Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #1a1a1a; --surface-hover: #2a2a2a;
            --text: #e0e0e0; --text-secondary: #888; --accent: #76b900;
            --user-bubble: #005a9e; --agent-bubble: #1e1e1e; --border: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .header h1 span { color: var(--accent); }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 6px 10px; border-radius: 20px; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:active { background: var(--surface-hover); }
        
        /* Chat Area */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%; padding: 10px 14px; border-radius: 16px;
            font-size: 15px; line-height: 1.5; word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }
        .message.agent {
            align-self: flex-start; background: var(--agent-bubble); border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        /* Markdown Formatting */
        .message.agent p { margin-bottom: 8px; }
        .message.agent p:last-child { margin-bottom: 0; }
        .message.agent strong { font-weight: 700; color: #fff; }
        .message.agent ul, .message.agent ol { margin-left: 20px; margin-bottom: 8px; }
        .message.agent li { margin-bottom: 4px; }
        .message.agent code { background: #333; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 14px; }
        .message.agent pre { background: #111; padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 8px; border: 1px solid var(--border); }
        .message.agent pre code { background: transparent; padding: 0; }
        .message.system {
            align-self: center; background: transparent; color: var(--text-secondary);
            font-size: 12px; text-align: center; max-width: 100%;
        }
        
        /* Input Area */
        .input-area {
            display: flex; gap: 8px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--surface); border-top: 1px solid var(--border); align-items: flex-end;
        }
        .input-area textarea {
            flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 10px 14px; border-radius: 24px; font-size: 16px; resize: none;
            outline: none; max-height: 120px; font-family: inherit;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        
        .action-btn {
            background: var(--border); border: none; color: var(--text); width: 44px; height: 44px;
            border-radius: 50%; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        #sendBtn { background: var(--accent); color: #000; font-weight: bold; }
        #sendBtn:disabled { opacity: 0.5; }
        
        /* Recording Animation */
        #micBtn { background: var(--surface-hover); }
        #micBtn.recording {
            background: #ff4444; color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        /* Modals */
        .modal-panel {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px); z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-panel.open { display: flex; }
        .modal-content {
            background: var(--surface); padding: 20px; border-radius: 16px; width: 100%;
            max-width: 400px; border: 1px solid var(--border); max-height: 85vh;
            display: flex; flex-direction: column;
        }
        .modal-content h2 { margin-bottom: 16px; font-size: 18px; }
        .modal-content label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; padding: 10px; margin-bottom: 16px; background: var(--bg);
            border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px;
            font-family: inherit;
        }
        .modal-content textarea { resize: vertical; min-height: 80px; }
        
        .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
        .btn-row button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
        .btn-save { background: var(--accent); color: #000; font-weight: 600; }
        .btn-close { background: var(--surface-hover); color: var(--text); }
        .disclaimer { font-size: 11px; color: var(--text-secondary); margin-top: 8px; line-height: 1.4; }
        
        /* History List */
        .history-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
        }
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg); padding: 12px; border-radius: 8px;
            border: 1px solid var(--border); cursor: pointer;
        }
        .history-title {
            font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .delete-btn {
            background: transparent; border: none; color: #ff4444; font-size: 16px; cursor: pointer;
            padding: 4px 8px; margin-left: 8px;
        }
        
        /* Typing Indicator */
        .typing { display: flex; gap: 4px; padding: 12px 16px; align-self: flex-start; }
        .typing span {
            width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button id="newChatBtn" class="icon-btn" title="New Chat">➕</button>
        <h1>⚡ NVIDIA <span>Agent</span></h1>
        <div class="header-actions">
            <button id="historyBtn" class="icon-btn" title="History">🕒</button>
            <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Area -->
    <div class="input-area">
        <button id="micBtn" class="action-btn" title="Voice Input">🎤</button>
        <textarea id="userInput" rows="1" placeholder="Ask the agent anything..."></textarea>
        <button id="sendBtn" class="action-btn" disabled>↑</button>
    </div>

    <!-- Settings Panel -->
    <div class="modal-panel" id="settingsPanel">
        <div class="modal-content">
            <h2>⚙️ Configuration</h2>
            <label for="apiKeyInput">NVIDIA API Key</label>
            <input type="password" id="apiKeyInput" placeholder="nvapi-...">
            
            <label for="modelSelect">Model (2026 Catalog)</label>
            <select id="modelSelect">
                <option value="nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super 120B (Recommended)</option>
                <option value="nvidia/nemotron-3.5-bolt-e4b">Nemotron 3.5 Bolt E4B (Fast)</option>
                <option value="deepseek-ai/deepseek-v4-flash">DeepSeek V4 Flash</option>
                <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
                <option value="nvidia/nemotron-3-ultra-550b-a55b">Nemotron 3 Ultra 550B (Reasoning)</option>
            </select>

            <label for="personaInput">Agent Persona / System Prompt</label>
            <textarea id="personaInput" placeholder="e.g., You are a strict coding teacher who explains things simply."></textarea>

            <div class="btn-row">
                <button class="btn-close" id="closeSettings">Cancel</button>
                <button class="btn-save" id="saveSettings">Save</button>
            </div>
            <p class="disclaimer">Your key is stored locally on this device only. Get a free key at build.nvidia.com.</p>
        </div>
    </div>

    <!-- History Panel -->
    <div class="modal-panel" id="historyPanel">
        <div class="modal-content">
            <h2>🕒 Chat History</h2>
            <div class="history-list" id="historyList"></div>
            <div class="btn-row">
                <button class="btn-close" id="closeHistory">Close</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        (function() {
            // --- State ---
            let apiKey = localStorage.getItem('nvidia_api_key') || '';
            let model = localStorage.getItem('nvidia_model') || 'nvidia/nemotron-3-super-120b-a12b';
            let persona = localStorage.getItem('nvidia_persona') || 'You are a helpful, concise AI assistant. Answer clearly and directly.';
            let isLoading = false;
            
            let allChats = JSON.parse(localStorage.getItem('nvidia_chats')) || [];
            let currentChatId = localStorage.getItem('nvidia_current_chat_id');
            let messages = [];

            // --- DOM Elements ---
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const micBtn = document.getElementById('micBtn');
            
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const closeSettings = document.getElementById('closeSettings');
            const saveSettings = document.getElementById('saveSettings');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const modelSelect = document.getElementById('modelSelect');
            const personaInput = document.getElementById('personaInput');

            const newChatBtn = document.getElementById('newChatBtn');
            const historyBtn = document.getElementById('historyBtn');
            const historyPanel = document.getElementById('historyPanel');
            const closeHistory = document.getElementById('closeHistory');
            const historyList = document.getElementById('historyList');

            // --- Initialization ---
            function init() {
                if (apiKey) {
                    apiKeyInput.value = apiKey;
                    modelSelect.value = model;
                    personaInput.value = persona;
                    sendBtn.disabled = false;
                }

                if (currentChatId) {
                    const savedChat = allChats.find(c => c.id === currentChatId);
                    if (savedChat) {
                        messages = savedChat.messages;
                        renderAllMessages();
                    } else {
                        startNewChat(false);
                    }
                } else {
                    startNewChat(false);
                }

                userInput.addEventListener('input', () => {
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                });

                setupSpeechRecognition();
            }

            // --- Chat History Logic ---
            function saveCurrentChat() {
                if (messages.length === 0) return;
                const chatIndex = allChats.findIndex(c => c.id === currentChatId);
                const firstUserMsg = messages.find(m => m.role === 'user');
                const title = firstUserMsg ? firstUserMsg.content.substring(0, 30) + (firstUserMsg.content.length > 30 ? '...' : '') : 'New Chat';

                const chatData = {
                    id: currentChatId,
                    title: title,
                    timestamp: Date.now(),
                    messages: messages
                };

                if (chatIndex > -1) allChats[chatIndex] = chatData;
                else allChats.unshift(chatData);

                localStorage.setItem('nvidia_chats', JSON.stringify(allChats));
                localStorage.setItem('nvidia_current_chat_id', currentChatId);
            }

            function startNewChat(saveCurrent = true) {
                if (saveCurrent) saveCurrentChat();
                currentChatId = 'chat_' + Date.now();
                localStorage.setItem('nvidia_current_chat_id', currentChatId);
                messages = [];
                chatContainer.innerHTML = '';
                
                if (!apiKey) addSystemMessage('Connect your NVIDIA API key in Settings to begin.');
                else addSystemMessage('New chat started.');
                
                renderHistoryList();
            }

            function loadChat(id) {
                saveCurrentChat();
                const chat = allChats.find(c => c.id === id);
                if (!chat) return;

                currentChatId = id;
                localStorage.setItem('nvidia_current_chat_id', currentChatId);
                messages = chat.messages;
                renderAllMessages();
                historyPanel.classList.remove('open');
            }

            function deleteChat(id, event) {
                event.stopPropagation();
                if (!confirm('Delete this chat?')) return;

                allChats = allChats.filter(c => c.id !== id);
                localStorage.setItem('nvidia_chats', JSON.stringify(allChats));

                if (currentChatId === id) startNewChat(false);
                else renderHistoryList();
            }

            function renderAllMessages() {
                chatContainer.innerHTML = '';
                messages.forEach(msg => renderMessageBubble(msg.role, msg.content));
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function renderHistoryList() {
                historyList.innerHTML = '';
                if (allChats.length === 0) {
                    historyList.innerHTML = '<div style="color:#888; text-align:center; padding: 20px;">No past chats yet.</div>';
                    return;
                }

                allChats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.onclick = () => loadChat(chat.id);

                    const title = document.createElement('div');
                    title.className = 'history-title';
                    title.textContent = chat.title;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '🗑️';
                    delBtn.onclick = (e) => deleteChat(chat.id, e);

                    div.appendChild(title);
                    div.appendChild(delBtn);
                    historyList.appendChild(div);
                });
            }

            // --- UI & Rendering ---
            function renderMessageBubble(role, content) {
                const div = document.createElement('div');
                div.className = `message ${role}`;
                if (role === 'agent') div.innerHTML = marked.parse(content);
                else div.textContent = content;
                
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function addMessage(role, content) {
                renderMessageBubble(role, content);
                messages.push({ role, content });
                saveCurrentChat();
            }

            function addSystemMessage(text) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.textContent = text;
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function showTyping() {
                const div = document.createElement('div');
                div.className = 'typing';
                div.id = 'typingIndicator';
                div.innerHTML = '<span></span><span></span><span></span>';
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function hideTyping() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }

            // --- Voice Recording (Speech-to-Text) ---
            function setupSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!SpeechRecognition) {
                    micBtn.style.display = 'none'; // Hide if browser doesn't support it
                    console.warn("Speech Recognition not supported in this browser.");
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                let isRecording = false;

                micBtn.addEventListener('click', () => {
                    if (isRecording) {
                        recognition.stop();
                        return;
                    }
                    try {
                        recognition.start();
                        micBtn.classList.add('recording');
                        isRecording = true;
                    } catch (err) {
                        console.error(err);
                    }
                });

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    userInput.value += (userInput.value ? ' ' : '') + transcript;
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    micBtn.classList.remove('recording');
                    isRecording = false;
                };

                recognition.onend = () => {
                    micBtn.classList.remove('recording');
                    isRecording = false;
                };
            }

            // --- API & Sending ---
            function explainError(status, rawBody) {
                let detail = '';
                try {
                    const parsed = JSON.parse(rawBody);
                    detail = parsed.error?.message || parsed.detail || parsed.message || '';
                } catch (e) {
                    detail = rawBody.slice(0, 200);
                }

                const base = `NVIDIA API Error (${status})`;
                switch (status) {
                    case 400: return `${base}: The request was rejected. Try switching models. Details: ${detail}`;
                    case 401: return `${base}: Your API key is invalid or expired.`;
                    case 403: return `${base}: Access forbidden. Your key may not have permission.`;
                    case 404: return `${base}: This model was retired. Pick a new one in Settings.`;
                    case 429: return `${base}: Rate limit reached. Wait a minute and try again.`;
                    default: return `${base}: ${detail || 'Unknown error.'}`;
                }
            }

            async function sendMessage() {
                const text = userInput.value.trim();
                if (!text || isLoading) return;

                if (!apiKey) {
                    addSystemMessage('⚠️ Please set your NVIDIA API key first.');
                    return;
                }

                addMessage('user', text);
                userInput.value = '';
                userInput.style.height = 'auto';
                isLoading = true;
                sendBtn.disabled = true;

                showTyping();

                try {
                    const sanitizedHistory = messages.map(msg => ({
                        role: msg.role === 'agent' ? 'assistant' : msg.role,
                        content: typeof msg.content === 'string' ? msg.content : ''
                    }));

                    const apiMessages = [
                        { role: 'system', content: persona }, // 🟢 Injecting the Persona here
                        ...sanitizedHistory
                    ];

                    const response = await fetch('https://nvidia-proxy.jeremiahhappiness998.workers.dev', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: apiMessages,
                            temperature: 0.7,
                            max_tokens: 1024,
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        const rawBody = await response.text();
                        throw new Error(explainError(response.status, rawBody));
                    }

                    const data = await response.json();
                    const reply = data.choices?.[0]?.message?.content;

                    if (!reply) throw new Error('No response content received from the model.');

                    hideTyping();
                    addMessage('agent', reply);

                } catch (error) {
                    hideTyping();
                    addSystemMessage(`❌ ${error.message}`);
                } finally {
                    isLoading = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }

            // --- Event Listeners ---
            settingsBtn.addEventListener('click', () => {
                apiKeyInput.value = apiKey;
                modelSelect.value = model;
                personaInput.value = persona;
                settingsPanel.classList.add('open');
            });

            closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));

            saveSettings.addEventListener('click', () => {
                const newKey = apiKeyInput.value.trim();
                if (!newKey) return alert('Please enter an API key.');
                
                apiKey = newKey;
                model = modelSelect.value;
                persona = personaInput.value.trim() || 'You are a helpful, concise AI assistant.';
                
                localStorage.setItem('nvidia_api_key', apiKey);
                localStorage.setItem('nvidia_model', model);
                localStorage.setItem('nvidia_persona', persona);
                
                settingsPanel.classList.remove('open');
                sendBtn.disabled = false;
                addSystemMessage('✅ Settings & Persona saved.');
            });

            newChatBtn.addEventListener('click', () => startNewChat(true));
            historyBtn.addEventListener('click', () => { renderHistoryList(); historyPanel.classList.add('open'); });
            closeHistory.addEventListener('click', () => historyPanel.classList.remove('open'));

            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // --- Start ---
            init();
        })();
    </script>
</body>
</html>
